name: Capture screenshot and demo

on:
  push:
    branches: [capture]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: submissions/horace/app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/out/build.log"

      - name: Enable KVM
        if: success()
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator and capture
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: .
          script: bash .github/capture.sh 2>&1 | tee out/capture.log

      - name: Publish results
        if: always()
        working-directory: .
        run: |
          find submissions/horace/app -path '*test-results*' -name '*.xml' -exec cp {} out/ \; || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan capture-output
          git rm -rfq --cached .
          git add -f out
          git commit -qm "Capture output for ${GITHUB_SHA}"
          git push -f origin capture-output
